<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NovaCart</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <nav>
    <div class="nav-left">
      <div class="logo">NovaCart</div>
      <div class="nav-links">
        <a href="index.html">Shop</a>
        <a href="about.html">About</a>
      </div>
    </div>
    <div class="nav-right">    
      <button class="btn login-btn" onclick="login()">Login</button>
      <button class="btn register-btn" onclick="register()">Register</button>
    </div>
  </nav>

    <main class="main-wrapper">
        <section class="login-card">
            <div class="left-side">
                <div class="content-overlay">
                    <p class="badge">WELCOME BACK</p>
                    <h1>Access your cart and continue shopping faster.</h1>
                    <p class="demo-text">
                        Your demo account is stored locally in this browser for portfolio and learning use.
                    </p>
                </div>
            </div>

            <div class="right-side">
                <div class="form-container">
                    <h2>Login</h2>
                    <p class="subtitle">Enter your registered email and password.</p>
                    
                    <form id="loginForm">
                        <div class="input-group">
                            <label>Email address</label>
                            <input type="email" placeholder="email@example.com" required>
                        </div>
                        
                        <div class="input-group">
                            <label>Password</label>
                            <input type="password" placeholder="••••••••" required>
                        </div>

                        <div class="form-footer">
                            <label class="checkbox-label">
                                <input type="checkbox" checked> Remember me
                            </label>
                            <a href="register.html" class="create-link">Create account</a>
                        </div>

                        <button type="submit" class="login-submit-btn">Login</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
